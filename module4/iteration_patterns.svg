<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="400" rx="14" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">The three iteration patterns</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#4b5563">Same loop, three different jobs. Ask: what should come out of it?</text>

  <!-- column template: input row, arrow, output -->
  <g id="acc">
    <rect x="30" y="85" width="260" height="290" rx="12" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="160" y="115" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d4ed8">ACCUMULATE</text>
    <text x="160" y="137" text-anchor="middle" font-size="13" fill="#1f2937">many values  →  ONE result</text>
    <g font-size="15" text-anchor="middle" fill="#1f2937">
      <rect x="50" y="155" width="44" height="34" rx="6" fill="#fff" stroke="#93c5fd"/><text x="72" y="178">3</text>
      <rect x="104" y="155" width="44" height="34" rx="6" fill="#fff" stroke="#93c5fd"/><text x="126" y="178">5</text>
      <rect x="158" y="155" width="44" height="34" rx="6" fill="#fff" stroke="#93c5fd"/><text x="180" y="178">2</text>
      <rect x="212" y="155" width="44" height="34" rx="6" fill="#fff" stroke="#93c5fd"/><text x="234" y="178">4</text>
    </g>
    <path d="M72 195 L150 245 M126 195 L155 245 M180 195 L165 245 M234 195 L170 245" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <rect x="120" y="248" width="80" height="40" rx="8" fill="#3b82f6"/><text x="160" y="275" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">14</text>
    <text x="95" y="318" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937">total = 0</text>
    <text x="95" y="338" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937">total = total + x</text>
    <text x="160" y="362" text-anchor="middle" font-size="12" fill="#4b5563">sum, count, build a string</text>
  </g>

  <g id="search">
    <rect x="320" y="85" width="260" height="290" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="450" y="115" text-anchor="middle" font-size="20" font-weight="bold" fill="#c2410c">SEARCH</text>
    <text x="450" y="137" text-anchor="middle" font-size="13" fill="#1f2937">look until FOUND, then stop</text>
    <g font-size="15" text-anchor="middle" fill="#1f2937">
      <rect x="340" y="155" width="44" height="34" rx="6" fill="#fff" stroke="#fdba74"/><text x="362" y="178">3</text>
      <rect x="394" y="155" width="44" height="34" rx="6" fill="#fff" stroke="#fdba74"/><text x="416" y="178">5</text>
      <rect x="448" y="155" width="44" height="34" rx="6" fill="#fed7aa" stroke="#f97316" stroke-width="2.5"/><text x="470" y="178" font-weight="bold">2</text>
      <rect x="502" y="155" width="44" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-dasharray="4 3"/><text x="524" y="178" fill="#9ca3af">4</text>
    </g>
    <text x="524" y="208" text-anchor="middle" font-size="11" fill="#9ca3af">never looked at</text>
    <path d="M470 195 L450 245" stroke="#f97316" stroke-width="2.5" fill="none"/>
    <rect x="390" y="248" width="120" height="40" rx="8" fill="#f97316"/><text x="450" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">found: 2</text>
    <text x="405" y="318" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937">if x &lt; 3:</text>
    <text x="437" y="338" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937">return x</text>
    <text x="450" y="362" text-anchor="middle" font-size="12" fill="#4b5563">first match, "is it there?", position</text>
  </g>

  <g id="filter">
    <rect x="610" y="85" width="260" height="290" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="740" y="115" text-anchor="middle" font-size="20" font-weight="bold" fill="#047857">FILTER</text>
    <text x="740" y="137" text-anchor="middle" font-size="13" fill="#1f2937">keep only SOME, in order</text>
    <g font-size="15" text-anchor="middle" fill="#1f2937">
      <rect x="630" y="155" width="44" height="34" rx="6" fill="#fff" stroke="#6ee7b7"/><text x="652" y="178">3</text>
      <rect x="684" y="155" width="44" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2.5"/><text x="706" y="178" font-weight="bold">5</text>
      <rect x="738" y="155" width="44" height="34" rx="6" fill="#fff" stroke="#6ee7b7"/><text x="760" y="178">2</text>
      <rect x="792" y="155" width="44" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2.5"/><text x="814" y="178" font-weight="bold">4</text>
    </g>
    <path d="M706 195 L720 245 M814 195 L770 245" stroke="#10b981" stroke-width="2.5" fill="none"/>
    <rect x="690" y="248" width="100" height="40" rx="8" fill="#10b981"/><text x="740" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">[5, 4]</text>
    <text x="660" y="318" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937">if x &gt; 3:</text>
    <text x="692" y="338" font-size="13" font-family="Menlo, Consolas, monospace" fill="#1f2937">result.append(x)</text>
    <text x="740" y="362" text-anchor="middle" font-size="12" fill="#4b5563">remove stop words, passing scores</text>
  </g>
</svg>
